name: Magnus & Myggen - Den Store Skattejagt
slug: magnus-myggen-den-store-skattejagt
version: Local BIN-CUE Wine wrapper
runner: linux
game_slug: magnus-myggen-den-store-skattejagt
script:
  game:
    exe: ./launch.sh
    working_dir: .
  installer:
    - chmodx: ./install.sh
    - chmodx: ./launch.sh
  system:
    gamemode: false
    gamescope: false
    env:
      MM2_MODE: game
      MM2_CD_DRIVE: d
      MM2_DESKTOP_SIZE: 800x600
      MM2_VIRTUAL_DESKTOP: "1"
      MM2_CENTER_WINDOW: "1"
      MM2_FORCE_WIN32: "1"
      MM2_WINVER: win98
  install_complete_text: Magnus & Myggen Den Store Skattejagt er tilføjet. Kør install.sh første gang for at hente/importere BIN/CUE og validere image-indholdet.
