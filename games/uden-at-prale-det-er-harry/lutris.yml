name: Uden at prale - det er Harry
slug: uden-at-prale-det-er-harry
version: Local BIN/CUE Wine wrapper
runner: linux
game_slug: uden-at-prale-det-er-harry
script:
  game:
    exe: ./launch.sh
    working_dir: .
  installer:
    - chmodx: ./install.sh
    - chmodx: ./launch.sh
  system:
    gamemode: false
    gamescope: false
    env:
      HARRY_MODE: game
      HARRY_DESKTOP_SIZE: 800x600
  install_complete_text: Uden at prale, det er Harry er tilføjet. Kør install.sh første gang for at hente/importere BIN/CUE eller CD/DVD og validere image-indholdet.
