# Ad-hoc DOSBox-Staging reference config for Gys på Regneslottet.
# The canonical runtime config is generated by ../launch.sh so it can use the
# current private runtime path. Keep this file path-free to avoid stale copies.

[sdl]
fullscreen = false
windowresolution = 1024x768
output = texture

[dosbox]
machine = svga_et4000
memsize = 16

[voodoo]
voodoo = false

[ethernet]
ne2000 = false

[cpu]
core = auto
cputype = 486
cpu_cycles = 40000

[dos]
xms = true
ems = false
umb = true

[mixer]
rate = 44100
blocksize = 1024
prebuffer = 20

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5

[midi]
mididevice = none

[autoexec]
@echo off
mount c .\GAME
imgmount d .\CDROM\CDROM.iso -t iso
c:
cd windows
win c:\gilisoft\gys_cd\wnewaddd.exe /CFG:c:\gilisoft\gys_cd\wnewadd.ini /startdir:d:\dansk
exit
