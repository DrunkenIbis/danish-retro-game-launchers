id: "magnus-myggen-quizkampen-superstarter"
title: "Magnus & Myggen: Quizkampen Superstarter"
runner: "wine"
status: "user-confirmed-q112dk-appimage-and-q122dk-original-setup"

repository_policy: "recipe-only; no game files included"

sources:
  references:
    - name: "Archive.org direct ISO reference"
      url: "https://archive.org/download/magnus-myggen-quizkampen-superstarter-version/Quizkampen%20Superstarter%20Version.iso"
      note: "Used by install.sh when the user chooses download. Verify legal status yourself."
    - name: "Original media"
      url: ""
      note: "Use your own legally obtained copy; install.sh can import a physical CD/DVD to ISO."

game_files:
  required:
    - filename: "Quizkampen Superstarter Version.iso"
      type: "cdrom-image"
      sha256: "0346759d435612e2c05170deab203402fae92e2345833dca98a69fb6afb61ae9"
      note: "Place under local/sources/magnus-myggen-quizkampen-superstarter/, set MMQ_ISO, or run install.sh."

paths:
  source_dir: "local/sources/magnus-myggen-quizkampen-superstarter"
  runtime_dir: "local/runtime/magnus-myggen-quizkampen-superstarter"

setup:
  installer: "install.sh"
  modes:
    - "existing ISO"
    - "download from archive.org reference URL"
    - "import physical CD/DVD with dd"

launch:
  wrapper: "launch.sh"
  lutris: "lutris.yml"
  default_mode: "game"
  executable: "mm12main.exe"
  notes:
    - "launch.sh is the historical CAB-only path and is not the verified Q122DK path. Use original setup and the installed executable as documented in Q122DK_DOWNLOAD.md."
    - "Wine prefix is win32/win98 by default."

appimage:
  script: "extras/build_q112dk_appimage.sh"
  status: "user-confirmed-gameplay-without-physical-cd"
  media: "Original Q112DK; not the historical Q122DK download above"
  host_requires: "CDEmu/VHBA, Python 3, udisksctl, findmnt, cp, compatible Wine system libraries"
  artifact: "local/appimage-dist/Quizkampen-Q112DK-WineGE-x86_64.AppImage"
  verification: "Bundled Wine observed; user-confirmed gameplay; exit 0; virtual medium cleanup verified"
  historical_q122dk_status: "CAB-only path failed; original setup now user-confirmed working"
  q122dk_appimage_status: "not-built-or-tested"
