[sdl]
fullscreen = false
windowresolution = 960x720
output = texture

[dosbox]
# Galactic Warrior Rats is a 1993 VGA DOS platformer from a 1.44 MB floppy image.
# Plain VGA/SVGA works; no Windows, CD-ROM or special mount flags are needed.
machine = svga_s3
memsize = 16

[voodoo]
voodoo = false

[ethernet]
ne2000 = false

[cpu]
core = auto
cputype = auto
# 6000 cycles kept menu/gameplay responsive in DOSBox-Staging 0.82.2 without
# making the platformer obviously too fast during the bounded smoke test.
cpu_cycles = 6000

[mixer]
rate = 48000
blocksize = 1024
prebuffer = 80

[sblaster]
# The archive has PCM sample files and no setup utility. Use the common SB16
# defaults exported in BLASTER=A220 I7 D1 H5 T6 by DOSBox-Staging.
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5

[midi]
# No MIDI/AdLib setup program was present in the floppy image; avoid requiring a
# host MIDI synth. OPL remains available through the Sound Blaster section.
mididevice = none

[autoexec]
@echo off
mount c "@GAME_DIR@"
c:
GWR.COM
exit
