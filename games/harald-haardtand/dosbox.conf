# DOSBox-Staging 0.83; cwd is the private runtime directory.
[sdl]
fullscreen = false
windowresolution = 960x720
output = opengl
pause_when_inactive = false
mute_when_inactive = false
[dosbox]
machine = svga_s3
memsize = 16
[cpu]
core = normal
cpu_cycles = @CYCLES@
[voodoo]
voodoo = false
[ethernet]
ne2000 = false
[mixer]
rate = 48000
blocksize = 1024
prebuffer = 80
[midi]
mididevice = none
[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
[autoexec]
@echo off
mount c ./game
c:
HARALD.EXE
exit
