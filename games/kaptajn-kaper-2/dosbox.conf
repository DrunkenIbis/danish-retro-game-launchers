# DOSBox-Staging 0.83; working directory is the private runtime.
[sdl]
fullscreen = false
window_size = 960x720
pause_when_inactive = false
[dosbox]
machine = svga_s3
memsize = 16
[cpu]
core = normal
cpu_cycles = @CYCLES@
[voodoo]
voodoo = false
[ethernet]
ne2000 = false
[midi]
mididevice = none
[autoexec]
@echo off
mount c ./game
c:
call GO.BAT
exit
