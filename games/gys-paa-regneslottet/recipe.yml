id: "gys-paa-regneslottet"
title: "Gys på Regneslottet"
runner: "dosbox-staging"
status: "working; user-confirmed gameplay/audio improvement with normal/15000"

repository_policy: "recipe-only; no game files included"

sources:
  references:
    - name: "Internet Archive search"
      url: "https://archive.org/search?query=Gys+på+Regneslottet"
      note: "Reference/search link only. Verify legal status yourself."
    - name: "Second-hand / original media"
      url: ""
      note: "Use your own legally obtained copy."

game_files:
  required:
    - filename: "Gys_Paa_Regneslottet.zip"
      type: "Windows 3.x game bundle with DOSBox tree and CDROM.iso"
      sha256: "0930e6961d89ac25638124812e0ad1637cb1cf97c0cc0229f937e5850461a0d2"
      size: 62693702
      note: "Place under local/sources/gys-paa-regneslottet/ or import with ./install.sh --archive PATH."

paths:
  source_dir: "local/sources/gys-paa-regneslottet"
  runtime_dir: "local/runtime/gys-paa-regneslottet"

launch:
  wrapper: "launch.sh"
  install: "install.sh"
  lutris_installer: "lutris.yml"
  lutris_game_config: "extras/gys-pa-regneslottet.lutris-game.yml"
  target: "Windows 3.x in DOSBox-Staging"
  command: "win c:\\gilisoft\\gys_cd\\wnewaddd.exe /CFG:c:\\gilisoft\\gys_cd\\wnewadd.ini /startdir:d:\\dansk"
  mounts:
    c: "runtime dosbox tree GAME/"
    d: "runtime dosbox tree CDROM/CDROM.iso"
  dosbox:
    config_source: "local/sources/gys-paa-regneslottet/Gys_Paa_Regneslottet/Gys På Regneslottet/SYSTEM/DOSBOX/dosbox.conf"
    generated_config: "local/runtime/gys-paa-regneslottet/gys-paa-regneslottet.conf"
    config_policy: "generate a clean DOSBox-Staging-native config derived from the bundled DOSBox-SVN/Daum profile; keep only the proven SVGA, CPU, Sound Blaster, and repo-local autoexec values to avoid legacy invalid/deprecated config warnings"
    windowresolution: "640x480"
    machine: "svga_et4000"
    cpu_core: "normal"
    cpu_type: "486"
    cycles: 15000
    mixer_rate: 44100
    mixer_blocksize: 2048
    mixer_prebuffer: 80
    sdl_audiodriver: "pulse"
    midi: "none"
    soundblaster: "sb2 at A220 I7 D1, matching the bundled Windows sndblst2.drv / Creative Labs Sound Blaster 1.5 driver"
    voodoo: false
    ne2000: false

# Historical troubleshooting notes; current defaults/status are above.
compatibility_notes:
  - "The bundled PROGMAN.INI references an unused Danish network group; launch.sh removes the Group3/Order reference and stale NETVÆRK/NETV’RK group files at runtime."
  - "unzip can return status 1 because of a local/central filename mismatch for NETV’RK.GRP; installer/launcher accepts that only after required files are present."
  - "User requested a pure DOSBox path using the bundled dosbox.conf. launch.sh now uses that bundled DOSBox-SVN/Daum config as the compatibility profile, but writes a clean Staging-native generated config with only the repo-local autoexec/window/memory/CPU/audio values needed for DOSBox-Staging launch. Human listening recheck still recommended."
  - "Runtime Windows 3.1 video is forced to Super VGA 640x480/256 colours (SVGA256.DRV, VDDSVGA.386, VGADIB.3GR, Tseng ET4000) and WinG is seeded with the bundled-good SVGA256 640x480x8 profile value 2 to avoid WinG display-driver dialogs."
  - "Audio was retuned after user reported crackle and slightly slow playback: DOSBox now defaults to 50000 cycles, larger 2048/80 mixer buffering, disables unused GUS/MIDI/NE2000/Voodoo devices, and emulates SB2 at A220 I7 D1 to match the bundled Windows Sound Blaster 1.5 driver."
  - "The generated runtime config is now Staging-native instead of a direct patched copy of the legacy DOSBox-SVN/Daum config, eliminating the invalid/deprecated CONFIG log spam while preserving the working launch path."

